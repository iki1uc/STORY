<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🛣️ UNI · HIGHWAY · TOOR · iki1uc</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;
    background:#050308;color:#f0e8e0;
    font-family:'Yu Mincho','Hiragino Mincho ProN','Times New Roman',serif;
    user-select:none;cursor:crosshair;
  }
  canvas{display:block;width:100vw;height:100vh;}

  #hud{
    position:fixed;top:18px;left:18px;
    background:rgba(8,6,10,0.72);
    border-left:3px solid #e04a3a;
    padding:12px 18px;
    font-size:13px;line-height:1.75;
    letter-spacing:1px;
    backdrop-filter:blur(6px);
    pointer-events:none;
    z-index:10;
  }
  #hud .v{color:#f4e0a0;font-weight:bold;}
  #hud .s{color:#e04a3a;}
  #hud .k{font-size:10px;letter-spacing:3px;color:#8a8098;text-transform:uppercase;}

  #speed{
    position:fixed;bottom:20px;right:20px;
    background:rgba(8,6,10,0.72);
    border:1px solid rgba(224,74,58,0.3);
    border-radius:6px;
    padding:10px 16px;
    font-family:'Consolas',monospace;
    font-size:11px;
    letter-spacing:2px;
    z-index:10;
    pointer-events:none;
  }
  #speed .bar{
    margin-top:6px;
    width:180px;height:5px;
    background:rgba(20,15,20,0.85);
    border-radius:2px;overflow:hidden;
  }
  #speed .fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#e04a3a,#f4e0a0);
    transition:width .25s;
    border-radius:2px;
  }
  #speed .lbl{color:#8a8098;}
  #speed .num{color:#f4e0a0;font-weight:bold;}

  #quote{
    position:fixed;bottom:20px;left:20px;
    font-size:15px;font-style:italic;
    color:rgba(240,232,224,0.65);
    max-width:60vw;
    pointer-events:none;
    z-index:10;
    transition:opacity .6s;
  }
  #quote .kanji{
    display:block;font-size:11px;
    letter-spacing:6px;color:#e04a3a;
    font-style:normal;margin-bottom:4px;
    text-transform:uppercase;
  }

  #seal{
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-50%) scale(0.4);
    font-size:180px;
    color:#f4e0a0;
    font-family:'Yu Mincho','Hiragino Mincho ProN',serif;
    text-shadow:0 0 80px rgba(224,74,58,0.95), 0 0 180px rgba(244,224,160,0.7);
    opacity:0;pointer-events:none;z-index:20;
    transition:opacity .35s, transform .6s cubic-bezier(.3,1.6,.4,1);
  }
  #seal.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

  @media(max-width:640px){
    #hud{padding:9px 12px;font-size:11px;}
    #quote{font-size:12px;max-width:50vw;}
    #speed{padding:7px 10px;font-size:9px;}
    #speed .bar{width:110px;}
    #seal{font-size:110px;}
  }
</style>
</head>
<body>

<canvas id="uni"></canvas>

<div id="hud">
  <div><span class="k">seite</span> <span class="v" id="hPage">1/81</span></div>
  <div><span class="k">kapitel</span> <span class="v" id="hChap">1/9</span></div>
  <div><span class="k">klick</span> <span class="s" id="hClick">0</span></div>
  <div><span class="k">zam</span> <span class="v" id="hZam">0</span></div>
  <div><span class="k">ready</span> <span class="v" id="hReady">…</span></div>
</div>

<div id="quote">
  <span class="kanji" id="qKanji">道</span>
  <span id="qText">「水は形を選ばない。」</span>
</div>

<div id="speed">
  <span class="lbl">HIGHWAY</span>
  <span class="num" id="sMode">OFF</span>
  <div class="bar"><div class="fill" id="sFill"></div></div>
</div>

<div id="seal">門</div>

<script>
"use strict";
// ═══════════════════════════════════════════════════════════════════
// 🛣️ UNI · HIGHWAY · TOOR · iki1uc
// Einbahnstraße wird Highway. Klick → Tinte. Tinte → Seite. Seite → ZaM.
// ═══════════════════════════════════════════════════════════════════

// ─── CONST ─────────────────────────────────────────────────────────
// Die Story-Struktur: 9 Kapitel (Ordner 1–9) × 9 Seiten (WEBP)
// Ordner haben unterschiedliche Bildnamen — wir liefern alle und
// lassen den Loader alles versuchen, fehlende werden prozedural gezeichnet.

const STORY = {
  chapters: [
    { id:'1', title:'生 · Leben',   kanji:'生', pages:['th (45).webp','th (46).webp','th (47).webp','th (48).webp','th (49).webp','th (50).webp','th (51).webp','th (52).webp','th (53).webp'] },
    { id:'2', title:'弟 · Schüler', kanji:'弟', pages:['th (35).webp','th (36).webp','th (37).webp','th (38).webp','th (39).webp','th (40).webp','th (41).webp','th (42).webp','th (43).webp'] },
    { id:'3', title:'旅 · Wanderer',kanji:'旅', pages:['th (26).webp','th (27).webp','th (28).webp','th (29).webp','th (30).webp','th (31).webp','th (32).webp','th (33).webp','th (34).webp'] },
    { id:'4', title:'侍 · Samurai', kanji:'侍', pages:['th (21).webp','th (22).webp','th (23).webp','th (24).webp','th (25).webp','th - 2026-09-09T064707.874.webp','th - 2026-09-09T064712.878.webp','th - 2026-09-09T064716.836.webp','th - 2026-09-09T064730.939.webp'] },
    { id:'5', title:'師 · Meister', kanji:'師', pages:['th - 2026-09-09T090013.989.webp','th - 2026-09-09T090018.602.webp','th - 2026-09-09T090022.981.webp','th - 2026-09-09T090027.704.webp','th - 2026-09-09T090036.955.webp','th - 2026-09-09T090043.533.webp','th - 2026-09-09T090052.763.webp','th - 2026-09-09T090055.915.webp','th - 2026-09-09T090059.462.webp'] },
    { id:'6', title:'賢 · Weiser',  kanji:'賢', pages:['th (69).webp','th (70).webp','th (71).webp','th (72).webp','th (73).webp','th - 2026-09-09T090059.462.webp','th - 2026-09-09T090104.571.webp','th - 2026-09-09T094926.529.webp','th - 2026-09-09T094929.785.webp'] },
    { id:'7', title:'悟 · Erleuchtet',kanji:'悟',pages:['th (74).webp','th (75).webp','th (76).webp','th (77).webp','th (78).webp','th (79).webp','th (80).webp','th (81).webp','th (82).webp'] },
    { id:'8', title:'無 · Leer',     kanji:'無', pages:['th (83).webp','th (84).webp','th (85).webp','th (86).webp','th (87).webp','th (88).webp','th (89).webp','th (90).webp','th (91).webp'] },
    { id:'9', title:'∞ · Ende→Anfang',kanji:'∞',pages:['th (92).webp','th (93).webp','th (94).webp','th (95).webp','th (96).webp','th (97).webp','th (98).webp','th (99).webp','th (100).webp'] },
  ],
  // Mögliche Ordner-Pfade (versucht der Loader in Reihenfolge)
  paths: ['', './', '1/', '2/', '3/', '4/', '5/', '6/', '7/', '8/', '9/', 'manga/', 'story/', 'STORY/'],
  totalPages: 81,
};

// Koans — Way of Life
const KOANS=[
  {k:'道',q:'「水は形を選ばない。」',  d:'Wasser wählt keine Form.'},
  {k:'和',q:'「和をもって尊しとなす。」', d:'Harmonie ist das Höchste.'},
  {k:'今',q:'「今、ここ、この息。」',     d:'Jetzt. Hier. Dieser Atem.'},
  {k:'空',q:'「空即是色。」',           d:'Leere ist Form.'},
  {k:'静',q:'「静けさは神の言葉。」',    d:'Stille ist Sprache der Götter.'},
  {k:'花',q:'「花は黙って散る。」',      d:'Blüten fallen schweigend.'},
  {k:'月',q:'「月は一滴に映る。」',      d:'Der Mond spiegelt sich im Tropfen.'},
  {k:'忍',q:'「忍は深さなり。」',        d:'Ertragen ist Tiefe.'},
  {k:'誠',q:'「誠は錆びない刃。」',      d:'Wahrheit rostet nicht.'},
  {k:'勇',q:'「勇は恐れの不在に非ず。」',d:'Mut ist nicht Abwesenheit der Furcht.'},
];

// ═══════════════════════════════════════════════════════════════════
// UNI — Konstante State (kein veränderliches Random hier)
// ═══════════════════════════════════════════════════════════════════
const UNI = {
  // Progression
  page: 0,             // 0..80 (81 Seiten)
  chapterIdx: 0,       // 0..8
  pageInChapter: 0,    // 0..8
  // Zähler
  klick: 0,
  zam: 0,
  // Ladezustand
  imagesLoaded: 0,
  imagesFailed: 0,
  ready: false,
  // Highway-Modus
  highway: false,
  highwaySpeed: 0,     // 0..1
  highwayTarget: 0,
  // Visual
  tick: 0,
  // Tinte
  drops: [],
  // Funken
  sparks: [],
  // Sakura
  petals: [],
  // Flash & Shake
  flash: 0,
  shake: 0,
  // Übergang
  transition: 0,       // 0..1 bei Page-Turn
  // Sitzung
  startTime: Date.now(),
  // Koan
  koanIdx: 0,
  // Cache geladener Bilder
  img: {},             // key -> HTMLImageElement | null
};

// ═══════════════════════════════════════════════════════════════════
// CANVAS — die Leinwand
// ═══════════════════════════════════════════════════════════════════
const cv = document.getElementById('uni');
const ctx = cv.getContext('2d');
let W, H, CX, CY, R, DPR;

function resize(){
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W/2; CY = H/2; R = Math.min(W,H)*0.36;
  initPetals();
}
window.addEventListener('resize', resize);

// ═══════════════════════════════════════════════════════════════════
// READY — Lade alle Bilder (async, Fallback erlaubt)
// ═══════════════════════════════════════════════════════════════════
function preloadImages(){
  const all = [];
  STORY.chapters.forEach((ch,ci)=>{
    ch.pages.forEach((p,pi)=>{
      all.push({key:`${ci}_${pi}`, file:p, chapter:ci, page:pi});
    });
  });
  let remaining = all.length;
  const done = ()=>{
    remaining--;
    UNI.imagesLoaded = all.length - remaining;
    document.getElementById('hReady').textContent = `${UNI.imagesLoaded}/${all.length}`;
    if(remaining <= 0){
      UNI.ready = true;
      console.log(`🛣️ READY · ${UNI.imagesLoaded} Bilder geladen, ${UNI.imagesFailed} Fallback`);
    }
  };
  all.forEach(item=>{
    const img = new Image();
    let tried = 0;
    const tryNext = ()=>{
      if(tried >= STORY.paths.length){
        UNI.img[item.key] = null;  // Fallback
        UNI.imagesFailed++;
        done();
        return;
      }
      img.onload = ()=>{ UNI.img[item.key] = img; done(); };
      img.onerror = ()=>{ tried++; tryNext(); };
      img.src = STORY.paths[tried] + item.file;
      tried++;
    };
    tryNext();
  });
}

// ═══════════════════════════════════════════════════════════════════
// TOOR — Torii-Gate als Zentrum
// ═══════════════════════════════════════════════════════════════════
function drawTorii(){
  const tw = R * 0.55;
  const th = R * 0.62;
  const x0 = CX - tw/2;
  const x1 = CX + tw/2;
  const yTop = CY - th*0.55;
  const yBot = CY + th*0.95;
  const postW = Math.max(5, R*0.022);
  const topH = Math.max(8, R*0.032);

  const pulse = UNI.zam > 0 ? (1 + 0.08*Math.sin(UNI.tick*0.15)) : 1;

  ctx.save();
  ctx.shadowColor = '#e04a3a';
  ctx.shadowBlur = UNI.zam > 0 ? 36 : 18;
  ctx.fillStyle = '#e04a3a';

  // Kasagi (oberer Bogen)
  ctx.fillRect(x0 - tw*0.08, yTop, tw*1.16, topH);

  // Nuki (zweiter Balken)
  ctx.fillRect(x0 - tw*0.03, yTop + topH*1.7, tw*1.06, topH*0.55);

  // Pfosten
  ctx.fillRect(x0, yTop, postW*pulse, yBot - yTop);
  ctx.fillRect(x1 - postW*pulse, yTop, postW*pulse, yBot - yTop);

  ctx.shadowBlur = 0;
  ctx.restore();

  // Öffnung (das Maß) — feiner Kreis
  ctx.beginPath();
  ctx.ellipse(CX, CY + th*0.1, tw*0.42, th*0.52, 0, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(244,224,160,${0.14 + 0.06*Math.sin(UNI.tick*0.05)})`;
  ctx.setLineDash([3, 8]);
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.setLineDash([]);
}

// ═══════════════════════════════════════════════════════════════════
// SAKURA — Petals
// ═══════════════════════════════════════════════════════════════════
function initPetals(){
  UNI.petals.length = 0;
  const n = 24;
  for(let i=0;i<n;i++){
    UNI.petals.push({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-0.5)*0.25, vy: 0.15 + Math.random()*0.4,
      rot: Math.random()*Math.PI*2, vrot: (Math.random()-0.5)*0.02,
      size: 2.5 + Math.random()*2.5,
      phase: Math.random()*Math.PI*2,
      alpha: 0.3 + Math.random()*0.4,
    });
  }
}

// ═══════════════════════════════════════════════════════════════════
// TINTE — Drops
// ═══════════════════════════════════════════════════════════════════
function spawnDrop(x, y){
  const dx = CX - x, dy = CY - y;
  const dist = Math.hypot(dx, dy);
  if(dist < 20) return;
  const a = Math.atan2(dy, dx);
  UNI.drops.push({
    x, y, a,
    r: dist,
    vr: -Math.max(2.5, dist*0.038),
    va: 0.004,
    life: 0,
    maxLife: 220,
    size: 2 + Math.random()*1.5,
    trail: [],
  });
}

function spawnSparks(x, y, color, n){
  n = n || 8;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 0.8 + Math.random()*2.5;
    UNI.sparks.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 0, maxLife: 25 + Math.random()*35,
      color: color || '#f4e0a0',
      size: 0.8 + Math.random()*1.4,
    });
  }
}

// ═══════════════════════════════════════════════════════════════════
// HIT-CHECK — trifft der Drop das Torii-Maß?
// ═══════════════════════════════════════════════════════════════════
function isHit(x, y){
  const tw = R * 0.55;
  const th = R * 0.62;
  const dy = y - CY;
  return Math.abs(x - CX) < tw*0.48 && dy > -th*0.15 && dy < th*0.85;
}

// ═══════════════════════════════════════════════════════════════════
// PAGE-WECHSEL — Einbahnstraße
// ═══════════════════════════════════════════════════════════════════
function nextPage(){
  if(UNI.transition > 0) return;
  UNI.page++;
  UNI.pageInChapter++;
  if(UNI.pageInChapter >= 9){
    UNI.pageInChapter = 0;
    UNI.chapterIdx++;
    if(UNI.chapterIdx >= 9) UNI.chapterIdx = 0;
    cycleKoan();
  }
  if(UNI.page >= 81){
    // Ende → Anfang (Ewigkeit)
    UNI.page = 0;
    UNI.chapterIdx = 0;
    UNI.pageInChapter = 0;
    UNI.zam++;
    showSeal('∞');
    updateHUD();
  }
  UNI.transition = 1;
  updateHUD();
}

function showSeal(kanji){
  const s = document.getElementById('seal');
  s.textContent = kanji || '門';
  s.classList.add('show');
  setTimeout(()=>s.classList.remove('show'), 1600);
}

// ═══════════════════════════════════════════════════════════════════
// KLICK — Tinte + Progress
// ═══════════════════════════════════════════════════════════════════
function click(x, y){
  UNI.klick++;
  spawnDrop(x, y);

  // Sound
  beep(520 + Math.random()*80, 0.03);

  // Jeder 9. Klick → Seite weiter (Einbahnstraße)
  if(UNI.klick % 9 === 0){
    nextPage();
    beep(880, 0.15);
  }
  // Alle 100 → ZaM
  if(UNI.klick % 100 === 0 && UNI.klick > 0){
    UNI.zam++;
    showSeal('門');
    spawnSparks(CX, CY, '#f4e0a0', 50);
    spawnSparks(CX, CY, '#e04a3a', 30);
    UNI.flash = 0.9;
    UNI.shake = 10;
    beep(440, 0.4);
    setTimeout(()=>beep(660, 0.35), 130);
    setTimeout(()=>beep(880, 0.5), 260);
    updateHUD();
  }
  updateHUD();
}

// ═══════════════════════════════════════════════════════════════════
// HIGHWAY — Beschleunigung: alle Seiten rauschen durch
// ═══════════════════════════════════════════════════════════════════
function toggleHighway(){
  UNI.highway = !UNI.highway;
  UNI.highwayTarget = UNI.highway ? 1 : 0;
  const el = document.getElementById('sMode');
  el.textContent = UNI.highway ? 'ON' : 'OFF';
  el.style.color = UNI.highway ? '#f4e0a0' : '';
  if(UNI.highway) beep(990, 0.2);
  else beep(330, 0.2);
}

// ═══════════════════════════════════════════════════════════════════
// KOAN — Way of Life
// ═══════════════════════════════════════════════════════════════════
function cycleKoan(){
  UNI.koanIdx = (UNI.koanIdx + 1) % KOANS.length;
  const k = KOANS[UNI.koanIdx];
  document.getElementById('qKanji').textContent = k.k;
  document.getElementById('qText').textContent = k.q;
}
setInterval(cycleKoan, 11000);

// ═══════════════════════════════════════════════════════════════════
// HUD
// ═══════════════════════════════════════════════════════════════════
function updateHUD(){
  document.getElementById('hPage').textContent = `${UNI.page + 1}/${STORY.totalPages}`;
  document.getElementById('hChap').textContent = `${UNI.chapterIdx + 1}/9`;
  document.getElementById('hClick').textContent = UNI.klick;
  document.getElementById('hZam').textContent = UNI.zam;
  const fill = document.getElementById('sFill');
  fill.style.width = (UNI.highwaySpeed*100).toFixed(0) + '%';
}

// ═══════════════════════════════════════════════════════════════════
// SOUND
// ═══════════════════════════════════════════════════════════════════
let audioCtx = null;
function beep(freq, dur){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.value = 0.035;
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(_){}
}

// ═══════════════════════════════════════════════════════════════════
// DRAW — der Rahmen + prozedurale Story-Seite
// ═══════════════════════════════════════════════════════════════════
function drawStoryPage(ci, pi){
  const key = `${ci}_${pi}`;
  const img = UNI.img[key];

  // Bereich für Bild (Manga-Panel innen)
  const pw = R*1.8;
  const ph = R*1.2;
  const px = CX - pw/2;
  const py = CY - ph/2;

  // Panel-Rahmen (weiß schmal, innen schwarz)
  ctx.fillStyle = 'rgba(8,6,10,0.92)';
  ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = 'rgba(240,232,224,0.35)';
  ctx.lineWidth = 2;
  ctx.strokeRect(px, py, pw, ph);
  ctx.strokeStyle = 'rgba(240,232,224,0.12)';
  ctx.lineWidth = 1;
  ctx.strokeRect(px+4, py+4, pw-8, ph-8);

  if(img){
    // Bild zeichnen, in Panel einpassen
    const iw = img.width, ih = img.height;
    const scale = Math.min(pw/iw, ph/ih);
    const dw = iw*scale, dh = ih*scale;
    const dx = px + (pw-dw)/2, dy = py + (ph-dh)/2;
    ctx.globalAlpha = 0.92;
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.globalAlpha = 1;
  } else {
    // Prozeduraler Fallback — Manga-Panel
    drawProceduralPanel(px, py, pw, ph, ci, pi);
  }

  // Seitenzahl im Panel
  ctx.fillStyle = 'rgba(240,232,224,0.55)';
  ctx.font = '10px Consolas';
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText(`${UNI.page+1}/${STORY.totalPages}`, px + pw - 8, py + ph - 8);

  // Kapitel-Kanji links oben
  const ch = STORY.chapters[ci];
  if(ch){
    ctx.fillStyle = 'rgba(244,224,160,0.75)';
    ctx.font = '22px "Yu Mincho","Hiragino Mincho ProN",serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(ch.kanji, px + 10, py + 8);
  }
}

function drawProceduralPanel(px, py, pw, ph, ci, pi){
  // Seed für deterministische Panels
  const seed = ci*9 + pi + 1;

  // Hintergrund
  const g = ctx.createLinearGradient(px, py, px, py+ph);
  g.addColorStop(0, `hsl(${(seed*11)%60}, 30%, 8%)`);
  g.addColorStop(1, `hsl(${(seed*17)%60}, 25%, 4%)`);
  ctx.fillStyle = g;
  ctx.fillRect(px, py, pw, ph);

  // Manga-Linien (Schraffur)
  ctx.save();
  ctx.beginPath();
  ctx.rect(px, py, pw, ph);
  ctx.clip();
  ctx.strokeStyle = 'rgba(240,232,224,0.05)';
  ctx.lineWidth = 0.8;
  for(let i=0; i<40; i++){
    const x = px + (i*23 + seed*7) % pw;
    ctx.beginPath();
    ctx.moveTo(x, py);
    ctx.lineTo(x - 30, py + ph);
    ctx.stroke();
  }
  ctx.restore();

  // Ein Kanji groß
  const kanjis = ['道','和','静','空','今','花','月','忍','誠','勇','無','∞'];
  const k = kanjis[seed % kanjis.length];
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#f4e0a0';
  ctx.font = `bold ${Math.min(pw,ph)*0.55}px "Yu Mincho","Hiragino Mincho ProN",serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(k, px + pw/2, py + ph/2);
  ctx.restore();

  // Kleines Sonnen-Symbol
  ctx.beginPath();
  ctx.arc(px + pw*0.85, py + ph*0.18, 14, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(224,74,58,0.35)';
  ctx.fill();
}

// ═══════════════════════════════════════════════════════════════════
// DRAW — Gesamtbild
// ═══════════════════════════════════════════════════════════════════
function draw(){
  const sx = (Math.random()-0.5) * UNI.shake;
  const sy = (Math.random()-0.5) * UNI.shake;
  ctx.save();
  ctx.translate(sx, sy);

  // Hintergrund
  ctx.fillStyle = '#050308';
  ctx.fillRect(-20, -20, W+40, H+40);

  // Aura
  const bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W,H)*0.75);
  bg.addColorStop(0, 'rgba(224,74,58,0.06)');
  bg.addColorStop(0.5, 'rgba(224,74,58,0.02)');
  bg.addColorStop(1, 'rgba(224,74,58,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 道 im Hintergrund
  ctx.save();
  ctx.globalAlpha = 0.03;
  ctx.fillStyle = '#f4e0a0';
  ctx.font = `bold ${R*1.4}px "Yu Mincho","Hiragino Mincho ProN",serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('道', CX, CY + R*0.1);
  ctx.restore();

  // Sakura hinten
  drawPetals(true);

  // Torii
  drawTorii();

  // Story-Seite (Manga-Panel)
  drawStoryPage(UNI.chapterIdx, UNI.pageInChapter);

  // Tinte
  drawDrops();

  // Funken
  drawSparks();

  // Sakura vorne
  drawPetals(false);

  ctx.restore();

  // Flash
  if(UNI.flash > 0.01){
    ctx.fillStyle = `rgba(244,224,160,${UNI.flash * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawPetals(behind){
  for(const p of UNI.petals){
    const isBehind = p.y < CY;
    if(isBehind !== behind) continue;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = '#ffb0c8';
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a = (i/5)*Math.PI*2;
      const a2 = a + Math.PI/5;
      const px = Math.cos(a)*p.size;
      const py = Math.sin(a)*p.size;
      if(i===0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
      ctx.lineTo(Math.cos(a2)*p.size*0.4, Math.sin(a2)*p.size*0.4);
    }
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, p.size*0.25, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,220,235,0.7)';
    ctx.fill();
    ctx.restore();
  }
}

function drawDrops(){
  for(const d of UNI.drops){
    d.trail.forEach((t, i)=>{
      const a = (i/d.trail.length) * 0.35;
      ctx.beginPath();
      ctx.arc(t.x, t.y, d.size*(i/d.trail.length)*0.65, 0, Math.PI*2);
      ctx.fillStyle = `rgba(224,74,58,${a})`;
      ctx.fill();
    });
    const x = CX + Math.cos(d.a) * d.r;
    const y = CY + Math.sin(d.a) * d.r * 0.9;

    const g = ctx.createRadialGradient(x, y, 0, x, y, d.size*4);
    g.addColorStop(0, 'rgba(244,224,160,0.9)');
    g.addColorStop(0.4, 'rgba(224,74,58,0.4)');
    g.addColorStop(1, 'rgba(224,74,58,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, d.size*4, 0, Math.PI*2); ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y, d.size, 0, Math.PI*2);
    ctx.fillStyle = '#f4e0a0';
    ctx.shadowColor = '#e04a3a';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawSparks(){
  for(const s of UNI.sparks){
    const a = 1 - s.life/s.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size*(0.5+a*0.5), 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ═══════════════════════════════════════════════════════════════════
// UPDATE
// ═══════════════════════════════════════════════════════════════════
function updateDrops(dt){
  for(let i = UNI.drops.length - 1; i >= 0; i--){
    const d = UNI.drops[i];
    d.r += d.vr * (dt/16);
    d.life++;
    const t = 1 - d.r/(R*2);
    d.a += d.va * (dt/16) * (0.5 + t);
    const x = CX + Math.cos(d.a)*d.r;
    const y = CY + Math.sin(d.a)*d.r*0.9;
    d.trail.push({x, y});
    if(d.trail.length > 8) d.trail.shift();
    if(d.r < R*0.14){
      if(isHit(x, y)){
        spawnSparks(x, y, '#f4e0a0', 10);
        spawnSparks(x, y, '#e04a3a', 4);
        beep(880 + Math.random()*120, 0.08);
        UNI.flash = Math.min(0.25, UNI.flash + 0.1);
      } else {
        spawnSparks(x, y, '#8a8098', 3);
      }
      UNI.drops.splice(i, 1);
      continue;
    }
    if(d.life > d.maxLife) UNI.drops.splice(i, 1);
  }
}

function updatePetals(dt){
  for(const p of UNI.petals){
    p.x += p.vx*(dt/16) + Math.sin(UNI.tick*0.02 + p.phase)*0.35;
    p.y += p.vy*(dt/16);
    p.rot += p.vrot*(dt/16);
    if(p.y > H + 20){ p.y = -20; p.x = Math.random()*W; }
    if(p.x < -20) p.x = W+20;
    if(p.x > W+20) p.x = -20;
  }
}

function updateSparks(dt){
  for(let i = UNI.sparks.length - 1; i >= 0; i--){
    const s = UNI.sparks[i];
    s.x += s.vx*(dt/16); s.y += s.vy*(dt/16);
    s.vx *= 0.94; s.vy *= 0.94;
    s.life++;
    if(s.life > s.maxLife) UNI.sparks.splice(i, 1);
  }
}

function updateHighway(dt){
  // Sanft zum Zielwert
  UNI.highwaySpeed += (UNI.highwayTarget - UNI.highwaySpeed) * 0.06;
  if(UNI.highway && UNI.highwaySpeed > 0.3){
    // Alle ~180ms eine Seite weiter, abhängig von Geschwindigkeit
    const interval = 180 / Math.max(0.5, UNI.highwaySpeed);
    if(UNI.tick % Math.max(4, Math.round(interval/16)) === 0){
      if(UNI.klick % 9 === 0) nextPage();
      UNI.klick++;
      if(UNI.klick % 100 === 0){
        UNI.zam++;
        showSeal('門');
        spawnSparks(CX, CY, '#f4e0a0', 40);
        UNI.flash = 0.8;
        beep(660, 0.3);
        updateHUD();
      }
    }
  }
  document.getElementById('sFill').style.width = (UNI.highwaySpeed*100).toFixed(0) + '%';
}

function updateFX(){
  UNI.flash *= 0.88; if(UNI.flash < 0.02) UNI.flash = 0;
  UNI.shake *= 0.88; if(UNI.shake < 0.3) UNI.shake = 0;
  if(UNI.transition > 0) UNI.transition = Math.max(0, UNI.transition - 0.05);
}

// ═══════════════════════════════════════════════════════════════════
// LOOP
// ═══════════════════════════════════════════════════════════════════
let lastT = 0;
function loop(now){
  const dt = Math.min(48, now - lastT || 16);
  lastT = now;
  UNI.tick++;

  updateDrops(dt);
  updatePetals(dt);
  updateSparks(dt);
  updateHighway(dt);
  updateFX();

  draw();
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════════════
cv.addEventListener('click', (e)=>{
  click(e.clientX, e.clientY);
});
cv.addEventListener('touchstart', (e)=>{
  const t = e.touches[0];
  if(t) click(t.clientX, t.clientY);
  e.preventDefault();
}, { passive: false });

document.addEventListener('keydown', (e)=>{
  if(e.key === ' '){ e.preventDefault(); click(CX + (Math.random()-0.5)*R*0.6, CY + (Math.random()-0.5)*R*0.5); }
  if(e.key === 'h' || e.key === 'H') toggleHighway();
  if(e.key === 'n' || e.key === 'N') nextPage();
  if(e.key === 'k' || e.key === 'K') cycleKoan();
});

// ═══════════════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════════════
window.UNI = {
  click: (n=1)=>{ for(let i=0;i<n;i++) click(CX, CY); },
  next: nextPage,
  highway: toggleHighway,
  koan: cycleKoan,
  state: ()=>({
    page: UNI.page, chapter: UNI.chapterIdx, pageInChapter: UNI.pageInChapter,
    klick: UNI.klick, zam: UNI.zam,
    ready: UNI.ready, loaded: UNI.imagesLoaded, failed: UNI.imagesFailed,
    highway: UNI.highway, speed: UNI.highwaySpeed,
  }),
  story: STORY,
  images: UNI.img,
};

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════
resize();
preloadImages();
updateHUD();

console.log('%c🛣️ UNI · HIGHWAY · TOOR · iki1uc','color:#e04a3a;font-weight:bold;font-size:14px;');
console.log('Klick = Tinte · Tinte = Seite · 9 Seiten = Kapitel · 100 Klick = ZaM');
console.log('H = HIGHWAY · N = next · K = Koan · Leertaste = Klick');
console.log('Die Einbahnstraße läuft.');

requestAnimationFrame(loop);
</script>
