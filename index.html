<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>STORY · JS ONLY · 360° · 100%</title>

<style>
  body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:40px; }
  h1 { color:#6cf; text-align:center; margin-bottom:30px; }
  .box { background:#111; border:1px solid #333; padding:20px; margin-bottom:25px; }
  pre { background:#000; padding:12px; border-left:3px solid #6cf; }
</style>
</head>

<body>

<h1>STORY · JS ONLY · 360° · 100%</h1>

<div class="box">
  <h2>JS‑Module (I U R X Y Z)</h2>
  <pre id="js"></pre>
</div>

<div class="box">
  <h2>360°‑Werte</h2>
  <pre id="deg"></pre>
</div>

<div class="box">
  <h2>100%‑Werte</h2>
  <pre id="pct"></pre>
</div>

<div class="box">
  <h2>Status‑Checker (OK / DONE)</h2>
  <pre id="status"></pre>
</div>

<script type="module">

  /* --- JS MODULE --- */
  import { I } from "./i.js";
  import { U } from "./u.js";
  import { R } from "./r.js";
  import { X } from "./x.js";
  import { Y } from "./y.js";
  import { Z } from "./z.js";

  const MODULES = [I, U, R, X, Y, Z];

  /* --- 360° + 100% --- */
  function toPercent(mod){
    return Math.round((mod.uni.charCodeAt(0) % 100));
  }

  function toDegrees(mod){
    return Math.round((mod.uni.charCodeAt(0) % 360));
  }

  /* --- STATUS --- */
  function status(mod){
    if(mod.uni && mod.raw) return { uni: mod.uni, status:"OK" };
    return { uni: mod.uni, status:"FAIL" };
  }

  /* --- MAIN --- */
  function run(){

    /* JS MODULE */
    document.getElementById("js").textContent =
      JSON.stringify(MODULES, null, 2);

    /* 360° */
    const deg = MODULES.map(m => ({
      uni: m.uni,
      deg: toDegrees(m)
    }));
    document.getElementById("deg").textContent =
      JSON.stringify(deg, null, 2);

    /* 100% */
    const pct = MODULES.map(m => ({
      uni: m.uni,
      pct: toPercent(m)
    }));
    document.getElementById("pct").textContent =
      JSON.stringify(pct, null, 2);

    /* STATUS */
    const stat = MODULES.map(m => status(m));
    document.getElementById("status").textContent =
      JSON.stringify(stat, null, 2);
  }

  run();

</script>

</body>
</html>
