<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>STORY · STATUS · 360° · 100%</title>

<style>
  body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:40px; }
  h1 { color:#6cf; text-align:center; margin-bottom:30px; }
  .box { background:#111; border:1px solid #333; padding:20px; margin-bottom:25px; }
  .ok { color:#0f0; }
  .fail { color:#f00; }
  pre { background:#000; padding:12px; border-left:3px solid #6cf; }
</style>
</head>

<body>

<h1>STORY · STATUS · 360° · 100%</h1>

<div class="box">
  <h2>JS‑Module (I U R X Y Z)</h2>
  <pre id="js"></pre>
</div>

<div class="box">
  <h2>CSV‑Daten → % und °</h2>
  <pre id="csv"></pre>
</div>

<div class="box">
  <h2>Status‑Checker (OK / READY / COMPATIBLE / DONE)</h2>
  <pre id="status"></pre>
</div>

<script type="module">

  /* --- JS MODULE --- */
  import { I } from "./i.js";
  import { U } from "./u.js";
  import { R } from "./r.js";
  import { X } from "./x.js";
  import { Y } from "./y.js";
  import { Z } from "./z.js";

  const JS_MODULES = { I, U, R, X, Y, Z };

  /* --- CSV LOADER --- */
  async function loadCSV(path){
    try {
      const res = await fetch(path);
      const text = await res.text();
      const rows = text.trim().split("\n");
      const header = rows[0].split(",");

      return rows.slice(1).map(line => {
        const values = line.split(",");
        const obj = {};
        header.forEach((h,i)=>obj[h.trim()] = values[i].trim());
        return obj;
      });
    } catch(e){
      return null;
    }
  }

  /* --- CSV → % und ° --- */
  function convertToPercent(raw){
    const keys = Object.keys(raw);
    const values = keys.map(k => raw[k].length);
    const sum = values.reduce((a,b)=>a+b,0);
    return values.map(v => Math.round((v/sum)*100));
  }

  function convertToDegrees(raw){
    const keys = Object.keys(raw);
    const values = keys.map(k => raw[k].length);
    const sum = values.reduce((a,b)=>a+b,0);
    return values.map(v => Math.round((v/sum)*360));
  }

  /* --- STATUS CHECKER --- */
  function checkStatus(file, raw){
    if(!raw) return { file, status:"MISSING", color:"fail" };
    return { file, status:"OK", color:"ok" };
  }

  /* --- MAIN --- */
  async function run(){

    /* JS MODULE */
    document.getElementById("js").textContent =
      JSON.stringify(JS_MODULES, null, 2);

    /* CSV LIST */
    const csvFiles = [
      "ebene-achse-3.csv",
      "grad-bewegung-8.csv",
      "grad-evo-8.csv",
      "kategorie-name-6.csv",
      "modul-zeichen-6.csv",
      "nc-parameter-kreis-bedeutung-3.csv",
      "status-farbe-11.csv",
      "technologie-boden-evo-8.csv",
      "verkehr-achse-3.csv",
      "weg-achse-3.csv"
    ];

    const csvResults = [];
    const statusList = [];

    for(const file of csvFiles){
      const raw = await loadCSV("./" + file);

      const status = checkStatus(file, raw);
      statusList.push(status);

      if(raw){
        const pct = convertToPercent(raw[0]);
        const deg = convertToDegrees(raw[0]);

        csvResults.push({
          file,
          raw: raw[0],
          percent: pct,
          degrees: deg
        });
      }
    }

    document.getElementById("csv").textContent =
      JSON.stringify(csvResults, null, 2);

    document.getElementById("status").textContent =
      JSON.stringify(statusList, null, 2);
  }

  run();

</script>

</body>
</html>
