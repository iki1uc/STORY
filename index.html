<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>STORY · STATUS · 360° · 100%</title>

<style>
  body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:40px; }
  h1 { color:#6cf; text-align:center; margin-bottom:30px; }
  .box { background:#111; border:1px solid #333; padding:20px; margin-bottom:25px; }
  pre { background:#000; padding:12px; border-left:3px solid #6cf; }
</style>
</head>

<body>

<h1>STORY · STATUS · 360° · 100%</h1>

<div class="box">
  <h2>JS‑Module (I U R X Y Z)</h2>
  <pre id="js"></pre>
</div>

<div class="box">
  <h2>CSV‑Daten → % und °</h2>
  <pre id="csv"></pre>
</div>

<div class="box">
  <h2>Status‑Checker (OK / MISSING)</h2>
  <pre id="status"></pre>
</div>

<script type="module">
window.onerror = (msg, url, line, col, error) => {
  const box = document.createElement("pre");
  box.style.color = "red";
  box.style.background = "#200";
  box.style.padding = "12px";
  box.style.borderLeft = "3px solid #f00";
  box.textContent = `JS-ERROR: ${msg}\nFILE: ${url}\nLINE: ${line}`;
  document.body.appendChild(box);
};

window.addEventListener("unhandledrejection", event => {
  const box = document.createElement("pre");
  box.style.color = "orange";
  box.style.background = "#220";
  box.style.padding = "12px";
  box.style.borderLeft = "3px solid #fa0";
  box.textContent = `PROMISE-ERROR: ${event.reason}`;
  document.body.appendChild(box);
});

 
  
  /* --- JS MODULE --- */
  import { I } from "./i.js";
  import { U } from "./u.js";
  import { R } from "./r.js";
  import { X } from "./x.js";
  import { Y } from "./y.js";
  import { Z } from "./z.js";

  const JS_MODULES = { I, U, R, X, Y, Z };

  /* --- CSV LOADER (mit Bereinigung) --- */
  async function loadCSV(path){
    try {
      const res = await fetch(path);
      const text = await res.text();

      const rows = text.trim().split("\n").filter(r => r.trim() !== "");
      const header = rows[0].split(",");

      return rows.slice(1).map(line => {
        const values = line.split(",");
        const obj = {};
        header.forEach((h,i)=>obj[h.trim()] = values[i].trim());
        return obj;
      });
    } catch(e){
      return null;
    }
  }

  /* --- CSV → % und ° --- */
  function convertToPercent(raw){
    const keys = Object.keys(raw);
    const values = keys.map(k => raw[k].length);
    const sum = values.reduce((a,b)=>a+b,0);
    return values.map(v => Math.round((v/sum)*100));
  }

  function convertToDegrees(raw){
    const keys = Object.keys(raw);
    const values = keys.map(k => raw[k].length);
    const sum = values.reduce((a,b)=>a+b,0);
    return values.map(v => Math.round((v/sum)*360));
  }

  /* --- STATUS CHECKER --- */
  function checkStatus(file, raw){
    if(!raw || raw.length === 0) return { file, status:"MISSING" };
    return { file, status:"OK" };
  }

  /* --- MAIN --- */
  async function run(){

    /* JS MODULE */
    document.getElementById("js").textContent =
      JSON.stringify(JS_MODULES, null, 2);

    /* CSV LIST */
    const csvFiles = [
      "1.csv",
      "2.csv",
      "3.csv",
      "3.csv",
      "4.csv",
      "5.csv",
      "6.csv",
      "7.csv",
      "8.csv",
      "9.csv",
      "10.csv"
      "11.csv",
      "12.csv"
    ];
    

    const csvResults = [];
    const statusList = [];

    for(const file of csvFiles){
      const raw = await loadCSV("./" + file);

      const status = checkStatus(file, raw);
      statusList.push(status);

      if(raw && raw.length > 0){
        const pct = convertToPercent(raw[0]);
        const deg = convertToDegrees(raw[0]);

        csvResults.push({
          file,
          raw: raw[0],
          percent: pct,
          degrees: deg
        });
      }
    }

    document.getElementById("csv").textContent =
      JSON.stringify(csvResults, null, 2);

    document.getElementById("status").textContent =
      JSON.stringify(statusList, null, 2);
  }

  run();

</script>

</body>
</html>
