<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>STORY · 360° · 100%</title>

<style>
  body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:40px; }
  h1 { color:#6cf; text-align:center; margin-bottom:30px; }
  .box { background:#111; border:1px solid #333; padding:20px; margin-bottom:25px; }
  pre { background:#000; padding:12px; border-left:3px solid #6cf; }
</style>
</head>

<body>

<h1>STORY · 360° · 100%</h1>

<div class="box">
  <h2>UNI‑Module (I U R X Y Z)</h2>
  <pre id="uni"></pre>
</div>

<div class="box">
  <h2>CSV‑Abbildung → % und °</h2>
  <pre id="csv"></pre>
</div>

<div class="box">
  <h2>360°‑Kreis</h2>
  <pre id="deg"></pre>
</div>

<div class="box">
  <h2>100%‑Werte</h2>
  <pre id="pct"></pre>
</div>

<script type="module">

  /* --- UNI MODULE --- */
  import { I } from "./i.js";
  import { U } from "./u.js";
  import { R } from "./r.js";
  import { X } from "./x.js";
  import { Y } from "./y.js";
  import { Z } from "./z.js";

  const UNI = [I, U, R, X, Y, Z];

  /* --- CSV LOADER --- */
  async function loadCSV(path){
    const res = await fetch(path);
    const text = await res.text();
    const rows = text.trim().split("\n");
    const header = rows[0].split(",");

    return rows.slice(1).map(line => {
      const values = line.split(",");
      const obj = {};
      header.forEach((h,i)=>obj[h.trim()] = values[i].trim());
      return obj;
    });
  }

  /* --- CSV → % und ° --- */
  function convertToPercent(raw){
    const keys = Object.keys(raw);
    const values = keys.map(k => raw[k].length);
    const sum = values.reduce((a,b)=>a+b,0);
    return values.map(v => Math.round((v/sum)*100));
  }

  function convertToDegrees(raw){
    const keys = Object.keys(raw);
    const values = keys.map(k => raw[k].length);
    const sum = values.reduce((a,b)=>a+b,0);
    return values.map(v => Math.round((v/sum)*360));
  }

  /* --- MAIN --- */
  async function run(){

    /* UNI MODULE */
    document.getElementById("uni").textContent =
      JSON.stringify(UNI, null, 2);

    /* CSV LIST */
    const csvFiles = [
      "ebene-achse-3.csv",
      "grad-bewegung-8.csv",
      "grad-evo-8.csv",
      "kategorie-name-6.csv",
      "modul-zeichen-6.csv",
      "nc-parameter-kreis-bedeutung-3.csv",
      "status-farbe-11.csv",
      "technologie-boden-evo-8.csv",
      "verkehr-achse-3.csv",
      "weg-achse-3.csv"
    ];

    const csvResults = [];

    for(const file of csvFiles){
      const raw = await loadCSV("./" + file);
      const pct = convertToPercent(raw[0]);
      const deg = convertToDegrees(raw[0]);

      csvResults.push({
        file,
        raw: raw[0],
        percent: pct,
        degrees: deg
      });
    }

    document.getElementById("csv").textContent =
      JSON.stringify(csvResults, null, 2);

    /* 360° */
    const degAll = csvResults.map(r => ({
      file: r.file,
      deg: r.degrees
    }));

    document.getElementById("deg").textContent =
      JSON.stringify(degAll, null, 2);

    /* 100% */
    const pctAll = csvResults.map(r => ({
      file: r.file,
      pct: r.percent
    }));

    document.getElementById("pct").textContent =
      JSON.stringify(pctAll, null, 2);
  }

  run();

</script>

</body>
</html>
